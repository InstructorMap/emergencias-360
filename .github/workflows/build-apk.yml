name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: actions/android-actions/setup-android@v3
        continue-on-error: true

      - name: Install dependencies
        run: npm install

      - name: Install Firebase Messaging plugin
        run: npm install @capacitor-firebase/messaging@^7.0.0 firebase@^11.0.0

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp socio.html www/ 2>/dev/null || true
          cp central.html www/ 2>/dev/null || true
          cp guardia.html www/ 2>/dev/null || true
          cp b2b.html www/ 2>/dev/null || true
          cp admin.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true

      - name: Initialize Capacitor Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # --- CAMBIO 1: verificar que el secret exista ANTES de seguir ---
      - name: Verify GOOGLE_SERVICES_JSON secret
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_CONTENT" ]; then
            echo "ERROR: El secret GOOGLE_SERVICES_JSON está vacío o no existe."
            exit 1
          fi
          echo "Secret OK (longitud: ${#GOOGLE_SERVICES_JSON_CONTENT} caracteres)"

      # --- CAMBIO 2: escribir el archivo DESPUÉS de que exista android/ ---
      # --- CAMBIO 3: usar printf '%s' (sin salto de línea extra) para no corromper el JSON ---
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
          echo "Archivo escrito: $(wc -c < android/app/google-services.json) bytes"

      - name: Generate app icons from resources
        run: npx capacitor-assets generate --android
        continue-on-error: true

      - name: Sync Capacitor
        run: npx cap sync android

      # --- CAMBIO 4: re-escribir el archivo DESPUÉS de cap sync ---
      # cap sync puede regenerar android/ y borrar el archivo.
      - name: Re-write google-services.json after cap sync
        env:
          GOOGLE_SERVICES_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON_CONTENT" > android/app/google-services.json
          echo "Archivo re-escrito post-sync: $(wc -c < android/app/google-services.json) bytes"

      # --- CAMBIO 5: verificar que el archivo esté en el lugar correcto antes de compilar ---
      - name: Verify google-services.json placement
        run: |
          if [ ! -f "android/app/google-services.json" ]; then
            echo "ERROR: android/app/google-services.json NO existe."
            exit 1
          fi
          ls -la android/app/google-services.json
          head -c 80 android/app/google-services.json
          echo ""

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emp-emergencias-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: "EMP Emergencias v1.1.${{ github.run_number }}"
          body: |
            APK generada automáticamente desde el commit ${{ github.sha }} (incluye Push SOS FCM).

            **Instalación:** descargá `app-debug.apk`, pasalo al teléfono Android, habilitá "orígenes desconocidos" e instalá.

            **Link directo:** https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
