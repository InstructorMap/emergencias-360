name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Prepare www directory
        run: |
          mkdir -p www
          cp index.html www/ 2>/dev/null || true
          cp socio.html www/ 2>/dev/null || true
          cp central.html www/ 2>/dev/null || true
          cp guardia.html www/ 2>/dev/null || true
          cp b2b.html www/ 2>/dev/null || true
          cp admin.html www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp -r css www/ 2>/dev/null || true
          cp -r js www/ 2>/dev/null || true
          cp -r assets www/ 2>/dev/null || true

      - name: Initialize Capacitor (first time)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
        continue-on-error: true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emp-emergencias-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "EMP Emergencias v1.0.${{ github.run_number }}"
          body: |
            APK generada automáticamente desde el commit ${{ github.sha }}.
            
            **Instalación:** descargá `app-debug.apk`, pasalo al teléfono Android, habilitá "orígenes desconocidos" e instalá.
            
            **Link directo de descarga:** https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
